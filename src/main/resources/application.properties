spring.application.name=customer-form-hub

# Database ? read the full JDBC URL from an env var, fall back to local for development
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/formhub}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

openai.api.key=${OPENAI_API_KEY}

# Use the port the hosting platform provides (Render sets PORT); default 8080 locally
server.port=${PORT:8080}

# CORS: comma-separated origins; defaults to the local Vite dev server
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}